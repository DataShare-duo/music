[project]
name = "music"
version = "0.1.0"
description = "Personal music player with FastAPI, SQLite and Vue"
authors = [{ name = "DataShare" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.21,<1", "alembic>=1.15,<2", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3", "mutagen>=1.47,<2",
  "musicdl @ git+https://github.com/CharlesPikachu/musicdl.git@dca2f0967e46a8faf8d279737535471102d74ca3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[project.scripts]
music = "music:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
