services:
  - type: web
    name: listen-music
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MUSIC_ACCESS_USERNAME
        value: 'music'
      - key: MUSIC_REQUEST_CONCURRENCY
        value: '16'
      - key: MUSIC_REQUEST_RATE_PER_MINUTE
        value: '120'
      - key: MUSIC_ACTION_RATE_PER_MINUTE
        value: '20'
      - key: MUSIC_SEARCH_TASK_LIMIT
        value: '4'
      - key: MUSIC_PROVIDER_QUEUE_SIZE
        value: '6'
      - key: MUSIC_VERIFICATION_QUEUE_SIZE
        value: '100'
      - key: MUSIC_STREAM_CONCURRENCY
        value: '6'
      - key: MUSIC_STREAM_PER_IP
        value: '3'
      - key: MUSIC_STREAM_PER_SESSION
        value: '2'
      - key: MUSIC_STREAM_MAX_SECONDS
        value: '900'
      - key: MUSIC_ACCESS_PASSWORD
        sync: false
      - key: MUSIC_DATABASE_URL
        value: 'sqlite+aiosqlite:///data/music.db'
      - key: MUSIC_NETWORK_TIMEOUT
        value: '12'
      - key: MUSIC_PROVIDER_CONCURRENCY
        value: '3'
      - key: MUSIC_FALLBACK_SOURCES
        value: '["netease","kuwo"]'
      - key: MUSIC_FULL_AUDIO_VERIFY_TIMEOUT
        value: '30'
      - key: MUSIC_FULL_AUDIO_VERIFY_CONCURRENCY
        value: '2'
      - key: MUSIC_FULL_AUDIO_RECHECK_INTERVAL
        value: '21600'
      - key: MUSIC_CATALOG_TARGET
        value: '500'
      - key: MUSIC_CATALOG_TTL
        value: '21600'
      - key: MUSIC_SEARCH_TTL
        value: '600'
      - key: MUSIC_FAILURE_COOLDOWN
        value: '60'
      - key: MUSIC_PLAYBACK_TTL
        value: '7200'
      - key: MUSIC_KEYWORDS
        value: '["2026","热门歌曲","流行","抖音热歌","华语流行","新歌","经典华语","独立音乐","民谣","治愈","轻音乐"]'
